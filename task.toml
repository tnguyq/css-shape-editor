schema_version = "1.1"

[task]
name = "codimango/css-shape-editor"
description = "Build a browser-based CSS shape editor: add shapes to a canvas, reorder (z-index), move, rotate, resize, recolor, and adjust corner radius. Graded by driving the UI in headless Chromium and asserting on the DOM / computed styles."
authors = [{ name = "Tina Nguyen Quang", email = "tnguyenq@meta.com" }]
keywords = ["css", "html", "javascript", "frontend", "canvas", "playwright"]
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"

[metadata]
author_name = "Tina Nguyen Quang"
author_email = "tnguyenq@meta.com"
difficulty = "hard"
category = "web_frontend"
category_usecase = "new_application"
category_subdomain = "web_frontend"
reward_type = "bounded_continuous"
languages = ["html", "css", "javascript"]
tags = ["css", "html", "javascript", "canvas", "interactive-ui", "playwright"]
expert_time_estimate_min = 45.0
junior_time_estimate_min = 120.0

[verifier]
# Isolate grading from the agent: run the verifier in a fresh container so the
# agent's code can't read the oracle under /tests at verify time. Opt-in —
# uncomment to enable (also requires a verifier env def under tests/).
# environment_mode = "separate"   # (separate mode does NOT give the verifier /app; unusable here)
timeout_sec = 900.0   # verifier drives the UI in the pre-baked Playwright image at verify time
# Run the grader as a non-root user so in-process agent code (Flow B) can't read
# root-owned oracle files. Off by default because this template's test.sh uses
# apt-get (needs root); enable it when your verifier imports/runs agent code
# in-process and does not itself need root.
# user = "nobody"

[agent]
timeout_sec = 1200.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
